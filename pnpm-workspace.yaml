# Security-floor overrides for transitive dependencies.
#
# These live here, not in package.json's `pnpm.overrides` block, because
# pnpm 11 no longer reads that field — it warns that the pnpm field is
# ignored and then resolves as though these floors did not exist. CI pins
# pnpm 10.6.1 through pnpm/action-setup, so it was safe there, but nothing
# pinned the version for a local or corepack run. packageManager now does.
overrides:
  "wrangler": ">=4.142.0 <5.0.0"
  "defu": ">=6.1.5 <7.0.0"
  "devalue": ">=5.6.2 <6.0.0"
  "h3": ">=1.15.6 <2.0.0"
  "js-yaml": ">=4.3.1 <5.0.0"
  "nanoid": ">=3.3.18 <4.0.0"
  "postcss": ">=8.5.18 <9.0.0"
  "rollup": ">=4.59.0 <5.0.0"
  "undici@7": ">=7.29.0 <8.0.0"
  "vite": ">=8.0.13 <9.0.0"
  "ws": ">=8.21.0 <9.0.0"
  "fast-uri": ">=3.1.6 <4.0.0"
  "lodash": ">=4.18.0 <5.0.0"
  "picomatch@2": ">=2.3.2 <3.0.0"
  "picomatch@4": ">=4.0.4 <5.0.0"
  "sharp": ">=0.35.4 <1.0.0"
